<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Power Garage - Auto Service & MOT Centre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Fundal stabil și de înaltă calitate cu mașină sport / motor */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(11, 11, 11, 0.5), rgba(11, 11, 11, 0.7), rgba(11, 11, 11, 0.85)),
                        url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: rgba(11, 11, 11, 0.95);
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            z-index: 101;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Sigla rotundă personalizată */
        .custom-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #0d1322;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.4);
            overflow: hidden;
            padding: 2px;
        }

        .custom-logo .logo-v8 {
            color: #ff3333;
            font-weight: 900;
            font-size: 15px;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .custom-logo .logo-power {
            color: #ff3333;
            font-weight: 800;
            font-size: 9px;
            line-height: 1;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        .custom-logo .logo-garage {
            color: #ffffff;
            font-style: italic;
            font-family: Georgia, serif;
            font-size: 8px;
            line-height: 1;
            margin-top: 2px;
        }

        .logo-text h1 {
            font-size: 15px;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ff3333;
        }

        .logo-text p {
            font-size: 9px;
            color: #aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: #161616;
            border: 1px solid #333;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        /* Meniul lateral / Dropdown */
        .dropdown-menu {
            position: fixed;
            top: 70px;
            right: 20px;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 14px;
            width: 270px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
            max-height: 80vh;
            overflow-y: auto;
        }

        .dropdown-menu.active {
            display: flex;
        }

        .dropdown-link {
            padding: 15px 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-link:hover {
            background: #ff1e1e;
            color: #fff;
        }

        .dropdown-link:last-child {
            border-bottom: none;
        }

        .services-submenu, .areas-submenu, .contact-submenu {
            display: none;
            background: #1a1a1a;
            border-left: 3px solid #ff1e1e;
        }

        .services-submenu.active, .areas-submenu.active, .contact-submenu.active {
            display: flex;
            flex-direction: column;
        }

        .services-submenu a, .areas-submenu a, .contact-submenu div, .contact-submenu a {
            padding: 12px 20px 12px 25px;
            color: #ddd;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid #262626;
            transition: background 0.2s;
        }

        .contact-submenu div span, .contact-submenu a span {
            color: #ff3333;
            display: block;
            font-size: 10px;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .services-submenu a:hover, .areas-submenu a:hover {
            background: #262626;
            color: #fff;
        }

        .arrow {
            font-size: 11px;
            transition: transform 0.3s ease;
        }
        .dropdown-link.active .arrow {
            transform: rotate(180deg);
        }

        /* Secțiuni (Pagini) */
        .page-section {
            display: none;
            flex: 1;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 150px;
        }

        .page-section.active {
            display: flex;
        }

        /* Home Page Styling */
        .top-badge {
            border: 1px solid rgba(255, 51, 51, 0.4);
            background: rgba(255, 30, 30, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6666;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            align-self: center;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero-title h2 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.15;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .hero-title p {
            font-size: 13px;
            color: #ddd;
            font-style: italic;
            text-shadow: 0 1px 5px rgba(0,0,0,0.9);
        }

        .reg-box {
            background: #facc15;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .reg-gb {
            background: #1d4ed8;
            color: white;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 8px;
            border-radius: 6px;
            margin-right: 15px;
            text-align: center;
            line-height: 1.1;
        }

        .reg-input {
            background: transparent;
            border: none;
            font-size: 22px;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            width: 100%;
            outline: none;
            letter-spacing: 2px;
        }

        .btn-main {
            background: linear-gradient(135deg, #ff1e1e, #cc0000);
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(255, 30, 30, 0.4);
            text-align: center;
            display: block;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .bottom-section {
            width: 100%;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 15px;
        }

        .service-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        .card {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: default;
        }

        .card-icon {
            font-size: 15px;
            margin-bottom: 6px;
            color: #ff3333;
        }

        .card-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .card-sub {
            font-size: 8px;
            color: #aaa;
        }

        .collect-box {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: default;
        }

        .collect-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .collect-icon {
            font-size: 18px;
            color: #22c55e;
        }

        .collect-text h4 {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .collect-text p {
            font-size: 9px;
            color: #aaa;
            margin-top: 1px;
        }

        .area-tag {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            font-size: 8px;
            font-weight: 800;
            padding: 4px 6px;
            border-radius: 5px;
            text-transform: uppercase;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* --- PAGINA 2 & 3 COMMON STYLING --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
            gap: 10px;
        }

            background: rgba(22, 22, 22, 0.9);
            border: 1
